<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI 晨报</title><style>/*CSS*/</style></head><body>
<header class="app-top"><span class="app-name">晨报阅读室</span><div class="document-tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM14 3v5h5"/></svg><span id="tabTitle">AI 晨报</span></div><span class="top-date" id="topDate"></span></header>
<div class="app-body"><nav class="rail" aria-label="阅读室功能"><div class="rail-top"><button id="readView" class="icon-button" aria-label="今日晨报" title="今日晨报" data-icon="file"></button><button id="projectsView" class="icon-button" aria-label="项目分析" title="项目分析" data-icon="folder"></button><button id="searchView" class="icon-button" aria-label="搜索日报" title="搜索日报" data-icon="search"></button><button id="calendarView" class="icon-button" aria-label="日报日历" title="日报日历" data-icon="calendar"></button></div><div class="rail-bottom"><button id="lightTheme" class="icon-button" aria-label="浅色主题" title="浅色主题" data-icon="sun"></button><button id="darkTheme" class="icon-button" aria-label="暗色主题" title="暗色主题" data-icon="moon"></button></div></nav>
<div class="workspace" id="workspace"><aside class="side desktop" id="leftPane" aria-label="信息源文件树"><div class="side-toolbar"><span>文件</span><span class="spacer"></span><button class="icon-button" id="collapseFolders" aria-label="折叠或展开所有信息源" title="折叠 / 展开" data-icon="collapse"></button></div><div id="tree" class="side-content"></div><div class="side-footer" id="treeFooter"></div></aside><div class="splitter" id="leftSplitter" role="separator" aria-label="调整左侧栏宽度" aria-orientation="vertical" aria-valuemin="180" aria-valuemax="460" tabindex="0"></div><main class="center"><div class="breadcrumb"><button id="filesButton" class="icon-button mobile-nav" aria-label="打开文件列表" title="文件" data-icon="folder"></button><span class="path-prefix" id="pathDate"></span><span class="path-prefix">/</span><span class="current-crumb" id="brand"></span><button id="outlineButton" class="icon-button mobile-nav" aria-label="打开文章大纲" title="大纲" data-icon="list"></button></div><article id="article" tabindex="-1"></article></main><div class="splitter" id="rightSplitter" role="separator" aria-label="调整右侧栏宽度" aria-orientation="vertical" aria-valuemin="170" aria-valuemax="380" tabindex="0"></div><aside class="side desktop" id="rightPane" aria-label="当前文章大纲"><div class="side-toolbar"><span>大纲</span></div><input class="outline-search" id="outlineSearch" placeholder="搜索大纲…" aria-label="搜索当前文章大纲"><div id="outline" class="side-content"></div></aside></div></div>
<footer class="statusbar"><span id="editionStatus"></span><span class="grow"></span><span id="articleCount"></span><span id="wordCount" class="desktop-stat"></span></footer>
<dialog id="drawer"><div class="drawer-head"><span id="drawerTitle"></span><button id="drawerClose" class="icon-button" aria-label="关闭侧栏" data-icon="close"></button></div><div id="drawerContent"></div></dialog><div id="glossary" class="glossary" role="dialog" aria-modal="false" aria-labelledby="termTitle" hidden><div class="glossary-head"><strong id="termTitle"></strong><button id="glossClose" class="icon-button" aria-label="关闭术语解释" data-icon="close"></button></div><p id="termDefinition"></p></div>
<script>/*SCRIPT*/</script></body></html>
