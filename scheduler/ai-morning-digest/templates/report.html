function rich(s){const parts=[];let last=0;const str=String(s??'');const re=/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s<>）。，；]+)/g;for(const m of str.matchAll(re)){parts.push(E(str.slice(last,m.index)));const u=m[2]||m[3];parts.push(`<a href="${E(u)}" target="_blank" rel="noopener">${E(m[1]||u)}</a>`);last=m.index+m[0].length}parts.push(E(str.slice(last)));return parts.join('')}
function articleText(a){return [a.title,`${a.source} · ${a.listing_date?'首发：':'日期：'}${a.date}${a.listing_date?' · HF 收录：'+a.listing_date:''}`,a.original_url?a.original_label+'：'+a.original_url:'',a.bodyMarkdown||[a.lead?'导读\n\n'+a.lead:'',a.full_markdown||[...(a.sections||[]).flatMap(s=>[s.title,...(s.paragraphs||[])])].filter(Boolean).join('\n\n'),...(a.links||[]).map(l=>`${l.title}: ${l.url}`)].filter(Boolean).join('\n\n')].filter(Boolean).join('\n\n')}
function sectionHTML(s,a,i){const level=Math.min(6,Math.max(2,Number(s.level)||2));return `<h${level} id="${E(a.id)}-s${i}">${E(s.title)}</h${level}>`+(s.html!==undefined?s.html:(s.paragraphs||[]).map(p=>`<p>${rich(p)}</p>`).join(''))}
function collectTerms(a){const list=(a.terms||[]).filter(t=>t.term&&t.definition).map(t=>({...t}));for(const table of document.querySelectorAll('#article table')){const heads=[...table.querySelectorAll('thead th')].map(t=>t.textContent.trim());if(!heads.some(t=>t.includes('通用名词'))||!heads.some(t=>t.includes('解释')))continue;const di=heads.findIndex(t=>t.includes('解释')),ni=heads.findIndex(t=>t.includes('叫法'));for(const row of table.querySelectorAll('tbody tr')){const cells=[...row.querySelectorAll('td')].map(t=>t.textContent.trim());const term=(cells[ni]||cells[0]||'').split(/[／/、（(]/)[0].trim();if(term.length<2||term.length>28||!cells[di]||list.some(x=>x.term===term))continue;list.push({term,definition:cells[di]});if(list.length>=8)break;}if(list.length>=8)break;}return list.slice(0,8)}
function annotateTerms(a){currentTerms=collectTerms(a);const root=document.querySelector('#article .doc');if(!root||!currentTerms.length)return;const used=new Set();const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>!n.nodeValue.trim()||n.parentElement.closest('h1,h2,h3,h4,h5,h6,a,button,pre,table,textarea,.action-panel,.meta,.term-hint,.references,.original-source')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const node of nodes){let text=node.nodeValue;let fragments=[];let cursor=0;for(;;){let best=null;currentTerms.forEach((t,i)=>{if(used.has(i))return;const pos=text.toLocaleLowerCase().indexOf(t.term.toLocaleLowerCase(),cursor);if(pos<0)return;const latin=/^[\x00-\x7F]+$/.test(t.term);if(latin&&(/[A-Za-z0-9_]/.test(text[pos-1]||'')||/[A-Za-z0-9_]/.test(text[pos+t.term.length]||'')))return;if(!best||pos<best.pos||(pos===best.pos&&t.term.length>best.term.length))best={pos,term:t.term,index:i};});if(!best)break;fragments.push(document.createTextNode(text.slice(cursor,best.pos)));const b=document.createElement('button');b.type='button';b.className='term';b.dataset.term=best.index;b.setAttribute('aria-haspopup','dialog');b.setAttribute('aria-expanded','false');b.setAttribute('aria-label',`解释：${best.term}`);b.textContent=text.slice(best.pos,best.pos+best.term.length);fragments.push(b);used.add(best.index);cursor=best.pos+best.term.length;}if(fragments.length){fragments.push(document.createTextNode(text.slice(cursor)));node.replaceWith(...fragments);}}document.querySelectorAll('#article [data-term]').forEach(b=>b.addEventListener('click',()=>openTerm(b)));}
function selectCopyText(){document.querySelector('#copyPanel').hidden=false;const area=document.querySelector('#copyArea');area.focus();area.select();area.setSelectionRange(0,area.value.length)}
async function copy(text){const area=document.querySelector('#copyArea');area.value=text;try{await navigator.clipboard.writeText(text);document.querySelector('#copyPanel').hidden=true;document.querySelector('#status').textContent='已复制';setTimeout(()=>{const el=document.querySelector('#status');if(el)el.textContent=''},1800)}catch{selectCopyText();document.querySelector('#status').textContent='自动复制不可用，已选择文本，请手动复制。'}}
function closeTerm(restore=true){if(gloss.hidden)return;gloss.hidden=true;termAnchor?.setAttribute('aria-expanded','false');if(restore&&termAnchor?.isConnected)termAnchor.focus();termAnchor=null}
function positionTerm(){if(gloss.hidden||!termAnchor)return;const r=termAnchor.getBoundingClientRect(),v=window.visualViewport;const leftBound=(v?.offsetLeft||0)+12,topBound=(v?.offsetTop||0)+12,width=v?.width||window.innerWidth,height=v?.height||window.innerHeight;gloss.style.maxWidth=Math.max(180,width-24)+'px';gloss.style.maxHeight=Math.max(120,height-24)+'px';const w=gloss.offsetWidth,h=gloss.offsetHeight;let left=Math.max(leftBound,Math.min(r.left,leftBound+width-w-24));let top=r.bottom+9;if(top+h>topBound+height-24)top=r.top-h-9;top=Math.max(topBound,Math.min(top,topBound+height-h-24));gloss.style.left=left+'px';gloss.style.top=top+'px'}
function openTerm(b){const t=currentTerms[+b.dataset.term];if(!t)return;const was=termAnchor===b&&!gloss.hidden;closeTerm(false);if(was)return;termAnchor=b;b.setAttribute('aria-expanded','true');document.querySelector('#termTitle').textContent=t.term;document.querySelector('#termDefinition').textContent=t.definition;gloss.hidden=false;positionTerm();document.querySelector('#glossClose').focus({preventScroll:true})}</script></body></html>
