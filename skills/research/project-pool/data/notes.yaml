- title: Grok Bot 云端 Agent 环境 QA
  date: "2026-11-03"
  source: 整理自与「新机器人」的对话探测 · Asia/Hong_Kong
  qa:
    - q: 多个机器人是共享一台电脑吗？
      a: 是。所有机器人共用同一台电脑（文件系统、已装软件、浏览器登录共享），但每个机器人有独立桌面和浏览器窗口，互不可见。对话、记忆、例行任务、人设各自独立。不要指望换机器人来隔离敏感文件。
    - q: 底层是什么操作系统？哪个发行版？
      a: Linux。探测为 Debian GNU/Linux 13 (trixie)。这是机器人共用电脑（box）的系统，不一定等于用户自己的实体电脑。
    - q: GNU 是什么意思？
      a: GNU's Not Unix 的递归缩写，指自由软件项目套件。Linux 内核常与 GNU 工具一起用，故常称 GNU/Linux。
    - q: 多个机器人如何隔离？
      a: 主要在桌面层隔离（独立屏幕/浏览器窗口）。电脑层共享。配置与状态（人设、对话、记忆、例行任务）各自独立。
    - q: 从计算机角度看，新增一个机器人新增了什么？
      a: 不是再开一台虚拟机。新增的是独立代理配置与状态，以及主机上属于它的独立桌面会话；底层内核、发行版、磁盘仍共享。
    - q: 这台电脑硬件资源怎么样？
      a: 约 8 核 x86_64 Intel Xeon（虚拟机常见显示）、内存约 15 GiB、根盘约 128 GB（当时已用约 5.2 GB）、无 swap。资源由多机器人共用。
    - q: 你的磁盘是不是只是工作区？装软件会不会占这块盘？
      a: 从机内看，/dev/vdb 128G 挂在根 /；/workspace、/usr、/opt、/var、/home 都在同一块盘。常规路径安装软件会占用这 128G。
    - q: 能不能用 apt 装包？
      a: apt-get update/install 当时基本不可用（Debian 源经出口代理返回 500）；可用 curl 下载 .deb 再 dpkg -i。Google Chrome 的 HTTPS apt 源是通的。
